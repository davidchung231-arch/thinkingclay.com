{{- partial "head.html" . -}}

<body>
  <main>
    <section style="max-width: 1100px; margin: 0 auto; padding: 5rem 2rem 3rem 2rem;">
      <h1 style="font-family: 'Cormorant Garamond', serif; color: #2D1B69; font-size: 2.4rem; font-weight: 600; margin-bottom: 2.5rem; text-align: center;">문의하기</h1>

      <form id="kr-contact-form" style="max-width: 500px; margin: 0 auto; line-height: 1.8;">
        <label style="display: block; margin-bottom: 0.3rem; font-weight: 500; font-size: 0.9rem;">이름</label>
        <input type="text" name="name" required style="width: 100%; padding: 0.7rem; margin-bottom: 1.2rem; border: 1px solid #E5E5E3; border-radius: 2px; font-family: 'Inter', sans-serif; font-size: 0.95rem; background: #fff;">

        <label style="display: block; margin-bottom: 0.3rem; font-weight: 500; font-size: 0.9rem;">이메일</label>
        <input type="email" name="email" required style="width: 100%; padding: 0.7rem; margin-bottom: 1.2rem; border: 1px solid #E5E5E3; border-radius: 2px; font-family: 'Inter', sans-serif; font-size: 0.95rem; background: #fff;">

        <label style="display: block; margin-bottom: 0.3rem; font-weight: 500; font-size: 0.9rem;">메시지</label>
        <textarea name="message" rows="6" required style="width: 100%; padding: 0.7rem; margin-bottom: 1.5rem; border: 1px solid #E5E5E3; border-radius: 2px; font-family: 'Inter', sans-serif; font-size: 0.95rem; background: #fff; resize: vertical;"></textarea>

        <button type="submit" style="background: #2D1B69; color: #fff; border: none; padding: 0.8rem 2.5rem; font-family: 'Inter', sans-serif; font-size: 0.95rem; cursor: pointer; letter-spacing: 0.05em;">보내기</button>
      </form>

      <p style="text-align: center; margin-top: 2rem; color: #555; font-size: 0.9rem;">
        <strong>이메일:</strong> <a href="mailto:hello@thinkingclay.com" style="color: #2D1B69;">hello@thinkingclay.com</a><br>
        <strong>전화:</strong> 609-255-3344
      </p>

      <div id="kr-contact-success" style="display: none; max-width: 500px; margin: 2.5rem auto 0 auto; background: #F5F5F3; padding: 2rem; border-left: 3px solid #2D1B69;">
        <p style="margin-top: 0; font-weight: 600; color: #2D1B69;">해결의 방향을 찾기 위한 첫걸음.</p>
        <p style="font-size: 0.9rem; line-height: 1.7; color: #555;">
          문의가 접수되었습니다. 담당자가 영업일 3일 내에 회신드리겠습니다.
        </p>
        <button onclick="window.location.href='/kr/'" style="margin-top: 1rem; background: transparent; color: #2D1B69; border: 1px solid #2D1B69; padding: 0.5rem 1.5rem; font-family: 'Inter', sans-serif; font-size: 0.85rem; cursor: pointer;">첫페이지로</button>
        <button onclick="resetKrContactForm()" style="margin-top: 1rem; background: transparent; color: #2D1B69; border: 1px solid #2D1B69; padding: 0.5rem 1.5rem; font-family: 'Inter', sans-serif; font-size: 0.85rem; cursor: pointer; margin-left: 0.5rem;">다시 문의하기</button>
      </div>

      <div id="kr-contact-error" style="display: none; max-width: 500px; margin: 2.5rem auto 0 auto; background: #FDF2F2; padding: 2rem; border-left: 3px solid #C0392B;">
        <p style="margin-top: 0; font-weight: 600; color: #C0392B;">전송에 실패했습니다.</p>
        <p style="font-size: 0.9rem; line-height: 1.7; color: #555;">
          다시 시도하거나, <a href="mailto:hello@thinkingclay.com" style="color: #2D1B69;">hello@thinkingclay.com</a>으로 직접 연락주세요.
        </p>
      </div>
    </section>
  </main>

  <script>
    const FORMSPREE_ENDPOINT = 'https://formspree.io/f/mkodwylo';

    function resetKrContactForm() {
      document.getElementById('kr-contact-form').style.display = 'block';
      document.getElementById('kr-contact-success').style.display = 'none';
      document.getElementById('kr-contact-error').style.display = 'none';
    }

    function submitKrContactForm(evt) {
      evt.preventDefault();

      const form = evt.target;
      const successEl = document.getElementById('kr-contact-success');
      const errorEl = document.getElementById('kr-contact-error');
      const btn = form.querySelector('button[type="submit"]');

      btn.disabled = true;
      btn.textContent = '전송 중...';

      fetch(FORMSPREE_ENDPOINT, {
        method: 'POST',
        body: new FormData(form),
        headers: { 'Accept': 'application/json' }
      })
      .then(function (res) {
        if (!res.ok) return res.text().then(function (t) { throw new Error(t); });
        form.style.display = 'none';
        successEl.style.display = 'block';
        form.reset();
      })
      .catch(function () {
        form.style.display = 'none';
        errorEl.style.display = 'block';
      })
      .finally(function () {
        btn.disabled = false;
        btn.textContent = '보내기';
      });
    }

    const krContactForm = document.getElementById('kr-contact-form');
    if (krContactForm) {
      krContactForm.addEventListener('submit', function (evt) {
        submitKrContactForm(evt);
      });
    }
  </script>

{{- partial "footer.html" . -}}

</body>
</html>
