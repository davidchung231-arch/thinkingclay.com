<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang | default "en" }}">
<head>
  {{- partial "head.html" . -}}
</head>
<body>
  {{- partial "header.html" . -}}
  <main id="main-content">
    <section style="min-height: 60vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 6rem 2rem 2rem 2rem;">
      <h1 style="font-family: 'Cormorant Garamond', serif; color: #2D1B69; font-size: 2.6rem; font-weight: 600; letter-spacing: 0.08em; margin-bottom: 3rem;">
        Ask. Think. Solve.
      </h1>
    </section>
  </main>

{{- partial "footer.html" . -}}

{{ if .Params.redirect }}
<meta http-equiv="refresh" content="{{ .Params.redirectDelay | default 3 }};url={{ .Params.redirect }}">
<script>setTimeout(()=>location.href="{{ .Params.redirect }}",{{ .Params.redirectDelay | default 3000 }});</script>
{{ end }}

</body>
</html>
