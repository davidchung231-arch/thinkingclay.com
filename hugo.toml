baseURL = 'https://thinkingclay.com/'
languageCode = 'en-us'
title = 'Thinking Clay LLC'
theme = 'accessble-minimalism-hugo-theme'
disableHugoGeneratorInject = true
enableRobotsTXT = true

[params]
author = 'David S. Chung, Esq.'
description = 'Practical business support, communication, and process improvement for businesses working in the United States.'

[params.theme]
  font = 'Inter'
  headingFont = 'Cormorant Garamond'
  primaryColor = '#242A31'
  backgroundColor = '#F3F1EC'

[menus]
  [[menus.footer]]
    name = 'Terms of Use'
    url = '/terms/'
    weight = 1
  [[menus.footer]]
    name = 'Privacy Policy'
    url = '/privacy/'
    weight = 2
  [[menus.footer]]
    name = 'Notice at Collection'
    url = '/notice-at-collection/'
    weight = 3

[markup.goldmark.renderer]
  unsafe = true
