<section class="tc-hero" aria-labelledby="tc-hero-title" data-slideshow>
  <div class="tc-hero-slides" aria-hidden="true">
    <figure class="tc-slide is-active" data-slide="0"><img src="/images/hero/mountains.webp" alt="Misty mountains and clouds at sunrise" width="1599" height="900" fetchpriority="high" decoding="async"></figure>
    <figure class="tc-slide" data-slide="1"><img src="/images/hero/architecture.webp" alt="Sculptural silver architecture under a quiet sky" width="1599" height="900" loading="lazy" decoding="async"></figure>
    <figure class="tc-slide" data-slide="2"><img src="/images/hero/skyline.webp" alt="New York skyline at dawn" width="1599" height="900" loading="lazy" decoding="async"></figure>
    <figure class="tc-slide" data-slide="3"><img src="/images/hero/corridor.webp" alt="Sunlit minimalist architectural corridor" width="1599" height="900" loading="lazy" decoding="async"></figure>
  </div>
  <div class="tc-hero-scrim" aria-hidden="true"></div>
  <div class="tc-hero-content">
    <p class="tc-hero-overline">THINKING CLAY LLC</p>
    <h1 id="tc-hero-title">Ask. Think. Solve.</h1>
    <p class="tc-hero-subtitle">Practical business support and clear communication for success in the U.S.</p>
    <div class="tc-hero-actions"><a class="tc-button tc-button-light" href="/services/">Our services <span aria-hidden="true">↗</span></a><a class="tc-button tc-button-quiet" href="/ko/" lang="ko">한국어 안내 <span aria-hidden="true">↗</span></a></div>
  </div>
  <div class="tc-hero-controls" aria-label="Hero slideshow controls">
    <button type="button" class="tc-slide-arrow" data-slide-prev aria-label="Previous hero image">←</button>
    <div class="tc-slide-dots" role="group" aria-label="Choose hero image">
      <button type="button" class="is-active" data-slide-dot="0" aria-label="Show hero image 1" aria-current="true"></button>
      <button type="button" data-slide-dot="1" aria-label="Show hero image 2"></button>
      <button type="button" data-slide-dot="2" aria-label="Show hero image 3"></button>
      <button type="button" data-slide-dot="3" aria-label="Show hero image 4"></button>
    </div>
    <button type="button" class="tc-slide-arrow" data-slide-next aria-label="Next hero image">→</button>
    <button type="button" class="tc-slide-pause" data-slide-toggle aria-pressed="false">Pause</button>
    <p class="visually-hidden" data-slide-status aria-live="polite">Hero image 1 of 4</p>
  </div>
</section>
<script>
(function () {
  'use strict';
  var root = document.querySelector('[data-slideshow]');
  if (!root) return;
  var slides = Array.prototype.slice.call(root.querySelectorAll('[data-slide]'));
  var dots = Array.prototype.slice.call(root.querySelectorAll('[data-slide-dot]'));
  var status = root.querySelector('[data-slide-status]');
  var toggle = root.querySelector('[data-slide-toggle]');
  var index = 0;
  var paused = false;
  var timer;
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function show(next) {
    index = (next + slides.length) % slides.length;
    slides.forEach(function (slide, i) { slide.classList.toggle('is-active', i === index); });
    dots.forEach(function (dot, i) { dot.classList.toggle('is-active', i === index); dot.toggleAttribute('aria-current', i === index); });
    status.textContent = 'Hero image ' + (index + 1) + ' of ' + slides.length;
  }
  function stop() { window.clearInterval(timer); }
  function start() { stop(); if (!paused && !reduceMotion) timer = window.setInterval(function () { show(index + 1); }, 5000); }
  root.querySelector('[data-slide-prev]').addEventListener('click', function () { show(index - 1); start(); });
  root.querySelector('[data-slide-next]').addEventListener('click', function () { show(index + 1); start(); });
  dots.forEach(function (dot, i) { dot.addEventListener('click', function () { show(i); start(); }); });
  toggle.addEventListener('click', function () { paused = !paused; toggle.setAttribute('aria-pressed', String(paused)); toggle.textContent = paused ? 'Play' : 'Pause'; start(); });
  root.addEventListener('mouseenter', stop);
  root.addEventListener('mouseleave', start);
  root.addEventListener('focusin', stop);
  root.addEventListener('focusout', function (event) { if (!root.contains(event.relatedTarget)) start(); });
  show(0);
  start();
}());
</script>
