<a href="#main-content" class="skip-link">Skip to main content</a>
<header style="max-width: 1100px; margin: 0 auto; padding: 1.2rem 2rem 0 2rem; width: 100%; box-sizing: border-box;">
  <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem; width: 100%; box-sizing: border-box;">

    <div style="display: flex; gap: 0.5rem; align-items: center;">
      <button id="a11y-font-decrease" aria-label="Decrease font size" title="Decrease font size" style="background: transparent; border: 1px solid #2D1B69; color: #2D1B69; width: 34px; height: 34px; border-radius: 2px; cursor: pointer; font-size: 1.1rem; font-weight: 600; line-height: 1;">A-</button>
      <button id="a11y-font-reset" aria-label="Reset font size" title="Reset font size" style="background: transparent; border: 1px solid #2D1B69; color: #2D1B69; width: 34px; height: 34px; border-radius: 2px; cursor: pointer; font-size: 0.7rem; font-weight: 600; line-height: 1; padding: 0 4px;">A</button>
      <button id="a11y-font-increase" aria-label="Increase font size" title="Increase font size" style="background: transparent; border: 1px solid #2D1B69; color: #2D1B69; width: 34px; height: 34px; border-radius: 2px; cursor: pointer; font-size: 1.2rem; font-weight: 600; line-height: 1;">A+</button>
      <button id="a11y-contrast-toggle" aria-label="Toggle high contrast mode" title="Toggle high contrast" style="background: transparent; border: 1px solid #2D1B69; color: #2D1B69; width: 34px; height: 34px; border-radius: 2px; cursor: pointer; font-size: 0.75rem; font-weight: 600; line-height: 1; padding: 0 4px;">&#9776;</button>
    </div>

    <nav aria-label="Primary navigation">
      {{ if or (eq .RelPermalink "/") (hasPrefix .RelPermalink "/attorney") }}
        {{ if hasPrefix .RelPermalink "/attorney" }}
          <a href="/attorney/" style="font-family:'Inter',sans-serif;color:#2D1B69;font-size:0.85rem;text-decoration:none;letter-spacing:0.05em;border-bottom:1px solid #2D1B69;padding-bottom:2px;">Home</a>
        {{ else }}
          <a href="/about/" style="font-family:'Inter',sans-serif;color:#2D1B69;font-size:0.85rem;text-decoration:none;letter-spacing:0.05em;border-bottom:1px solid #2D1B69;padding-bottom:2px;">About</a>
        {{ end }}
      {{ else }}
        <a href="/" style="font-family:'Inter',sans-serif;color:#2D1B69;font-size:0.85rem;text-decoration:none;letter-spacing:0.05em;border-bottom:1px solid #2D1B69;padding-bottom:2px;">Home</a>
      {{ end }}
    </nav>
  </div>
</header>
