<!DOCTYPE html>
<html lang="{{ .Params.pageLanguage | default "en" }}">
<head>
  {{- partial "head.html" . -}}
</head>
<body class="tc-site tc-interior">
  {{- partial "header.html" . -}}
  <main id="main-content">
    <section class="tc-page-hero" aria-labelledby="page-title"><p class="tc-eyebrow">Thinking Clay LLC</p><h1 id="page-title">{{ .Title }}</h1></section>
    <section class="tc-reading-section">{{ .Content }}</section>
  </main>

{{- partial "footer.html" . -}}

{{ if .Params.redirect }}
<script>setTimeout(function(){location.href="{{ .Params.redirect }}";},{{ .Params.redirectDelay | default 3000 }});</script>
{{ end }}

</body>
</html>
