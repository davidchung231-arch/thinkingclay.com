{{- partial "head.html" . -}}

<body>
  <main>
    <section style="max-width: 1100px; margin: 0 auto; padding: 5rem 2rem 3rem 2rem; line-height: 1.8;">
      {{ .Content }}
    </section>
  </main>

{{- partial "footer.html" . -}}

{{ if .Params.redirect }}
<script>setTimeout(function(){location.href="{{ .Params.redirect }}";},{{ .Params.redirectDelay | default 3000 }});</script>
{{ end }}

</body>
</html>
